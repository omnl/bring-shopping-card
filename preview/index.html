<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bring! Shopping Card – Vorschau</title>
    <style>
      :root {
        --primary-color: #ff5a00;
        --primary-text-color: #202124;
        --secondary-text-color: #6b7280;
        --card-background-color: #ffffff;
        --divider-color: #e5e7eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 20px;
        color: var(--primary-text-color);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f3f5;
      }
      main { max-width: 760px; margin: 0 auto; }
      .preview-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 20px;
        color: #4b5563;
        font-size: 14px;
      }
      .preview-bar strong { color: #202124; }
      .preview-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .size-switch { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid #d1d5db; border-radius: 9px; background: white; }
      .size-switch button {
        border: 0;
        border-radius: 6px;
        padding: 5px 8px;
        cursor: pointer;
        background: transparent;
        color: #4b5563;
        font: inherit;
        font-size: 12px;
      }
      .size-switch button.active { background: #ff5a00; color: white; font-weight: 600; }
      .theme-toggle {
        cursor: pointer;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px 12px;
        background: white;
        color: inherit;
        font: inherit;
      }
      body.dark {
        --primary-text-color: #e8eaed;
        --secondary-text-color: #aeb4bd;
        --card-background-color: #24272b;
        --divider-color: #3d4146;
        background: #17191c;
      }
      body.dark .preview-bar strong { color: #e8eaed; }
      body.dark .theme-toggle { background: #24272b; border-color: #4b5159; }
      body.dark .size-switch { background: #24272b; border-color: #4b5159; }
      body.dark .size-switch button { color: #d1d5db; }
      bring-shopping-card { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="preview-bar">
        <span><strong>Home-Assistant-Vorschau</strong> · lokale Demo-Daten</span>
        <div class="preview-controls">
          <div class="size-switch" aria-label="Kartengröße">
            <button type="button" data-size="small">Klein</button>
            <button type="button" data-size="medium" class="active">Mittel</button>
            <button type="button" data-size="large">Groß</button>
          </div>
          <button class="theme-toggle" type="button">Dunkles Theme</button>
        </div>
      </div>
      <div id="card"></div>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
